---
- name: Install and deploy Nginx web servers
  hosts: webservers
  become: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Display deployment target
      ansible.builtin.debug:
        msg: "Deploying application on {{ inventory_hostname }}"

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure Nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy application webpage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head>
            <title>My Updated CI/CD Project</title>
          </head>
          <body>
            <h1>Welcome to My town CI/CD Project!</h1>
            <p>Deployment Version: 2.0</p>
            <p>Server: {{ inventory_hostname }}</p>
            <p>Updated automatically using GitHub, Jenkins and Ansible.</p>
            <p>Deployment successful!</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Nginx

    - name: Restart Nginx before verification if changed
      ansible.builtin.meta: flush_handlers

    - name: Verify Nginx HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1
        method: GET
        status_code: 200
        return_content: true
      register: nginx_response

    - name: Display deployment verification
      ansible.builtin.debug:
        msg: "Nginx deployment successful on {{ inventory_hostname }}"

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
