---
- name: Install and deploy Nginx web servers
  hosts: webservers
  become: true
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Display deployment target
      ansible.builtin.debug:
        msg: "Deploying on {{ inventory_hostname }}"

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy application webpage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head><title>My CI/CD Project</title></head>
          <body>
          <h1>Welcome to My CI/CD Project!</h1>
          <p>Deployment Version: 2.0</p>
          <p>Server: {{ inventory_hostname }}</p>
          <p>Deployment successful!</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Nginx

    - name: Apply pending handlers
      ansible.builtin.meta: flush_handlers

    - name: Verify Nginx HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
